[workspace]
resolver = "2"
members = [
    "core",
    "command",
    "commands",
    "compositor",
    "config",
    "renderer",
    "shell",
    "term",
    "theme",
    "notes",
    "dashboard",
    "launcher",
    "vision",
    "plugins",
    "plugins/slate-plugin",
    "cli",
    "ctl",
    "ipc"
]

[workspace.package]
rust-version = "1.75"
homepage = "https://github.com/flessan/slate-de"
version = "0.1.0"
edition = "2021"
authors = ["flessan"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/flessan/slate-de"

[workspace.dependencies]
# Wayland & Graphics
smithay = { version = "0.3", features = ["backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "input", "wayland-server", "wayland-protocols"] }
wayland-server = "0.31"
wayland-protocols = { version = "0.31", features = ["staging"] }

# TUI & Rendering
ratatui = { version = "0.26", default-features = false }
crossterm = "0.27"

# Async & Runtime
tokio = { version = "1.36", features = ["full"] }
futures = "0.3"

# Extensibility
wasmtime = "19.0"
wit-bindgen = "0.21"

# Utils
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "1.0"
parking_lot = "0.12"
