[package]
name = "slate-shell"
description = "The Slate desktop shell: event loop, panes, theme-aware rendering, snapshots"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "slate_shell"
path = "src/lib.rs"

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
slate-ipc = { path = "../ipc" }
slate-core = { path = "../core" }
slate-config = { path = "../config" }
slate-term = { path = "../term" }
slate-theme = { path = "../theme" }
slate-command = { path = "../command" }
slate-vision = { path = "../vision" }
# Added stubs to satisfy imports in app.rs and panes.rs
slate-notes = { path = "../notes" }
slate-dashboard = { path = "../dashboard" }
slate-launcher = { path = "../launcher" }
